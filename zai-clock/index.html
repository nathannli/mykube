<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GLM-5.3-Flash off-peak clock</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #9dafc8;
      --faint: #65748e;
      --panel: rgba(10, 18, 33, 0.68);
      --panel-strong: rgba(13, 24, 43, 0.86);
      --line: rgba(255, 255, 255, 0.13);
      --cyan: #22d3ee;
      --cyan-soft: rgba(34, 211, 238, 0.16);
      --orange: #ff6b4a;
      --gold: #ffd166;
      --green: #2ee59d;
      --violet: #9b87ff;
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(18px, 3vw, 40px);
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 14% 12%, rgba(34, 211, 238, 0.28), transparent 30rem),
        radial-gradient(circle at 86% 16%, rgba(255, 107, 74, 0.25), transparent 28rem),
        radial-gradient(circle at 54% 100%, rgba(155, 135, 255, 0.20), transparent 32rem),
        linear-gradient(140deg, #050914 0%, #09111f 48%, #111827 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 45%, black, transparent 76%);
    }

    .app {
      width: min(1180px, 100%);
      display: grid;
      gap: 20px;
    }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(8, 15, 28, 0.48);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(22px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2vw, 1.55rem);
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 550;
    }

    .pulse {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(46, 229, 157, 0.12), 0 0 24px rgba(46, 229, 157, 0.85);
    }

    .is-tone-normal .pulse {
      background: var(--orange);
      box-shadow: 0 0 0 6px rgba(255, 107, 74, 0.13), 0 0 26px rgba(255, 107, 74, 0.9);
    }

    .is-tone-special .pulse {
      background: var(--cyan);
      box-shadow: 0 0 0 6px rgba(34, 211, 238, 0.14), 0 0 26px rgba(34, 211, 238, 0.85);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(360px, 1.08fr) minmax(340px, 0.92fr);
      gap: 20px;
      align-items: stretch;
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.09), rgba(255,255,255,0.025)),
        var(--panel);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.09);
      backdrop-filter: blur(26px);
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 1px;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(140deg, rgba(255,255,255,0.12), transparent 28%, transparent 72%, rgba(255,255,255,0.05));
      mask: linear-gradient(#000, transparent 42%);
    }

    .clock-panel {
      padding: clamp(20px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .clock-controls {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-bottom: -8px;
    }

    .clock-wrap {
      position: relative;
      width: min(580px, 100%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .orbital-glow {
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      background:
        conic-gradient(from -90deg, rgba(34,211,238,0.20), rgba(34,211,238,0.05), rgba(255,107,74,0.18), rgba(255,209,102,0.16), rgba(34,211,238,0.20));
      filter: blur(18px);
      opacity: 0.95;
      will-change: transform, opacity;
      animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
      50% { transform: scale(1.025); opacity: 0.72; }
    }

    svg {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Static shadow under the dial. A filter on the <svg> itself would force a
       full re-rasterisation on every hand or arc update. */
    .clock-wrap::before {
      content: "";
      position: absolute;
      inset: 9%;
      border-radius: 50%;
      box-shadow: 0 22px 48px rgba(0,0,0,0.36);
      pointer-events: none;
    }

    /* Glows are dropped for the duration of the 12h/24h transition: SVG
       drop-shadow filters are re-rendered on each frame the geometry moves. */
    .clock-wrap.is-transitioning .arc,
    .clock-wrap.is-transitioning .hour-hand,
    .clock-wrap.is-transitioning .minute-hand,
    .clock-wrap.is-transitioning .second-hand,
    .clock-wrap.is-transitioning .hub { filter: none; }

    .face-fill { fill: rgba(7, 14, 27, 0.76); stroke: rgba(255,255,255,0.13); stroke-width: 1; }
    .base-ring { fill: none; stroke: rgba(255,255,255,0.09); stroke-width: 24; }
    .quiet-ring { fill: none; stroke: rgba(34, 211, 238, 0.25); stroke-width: 15; stroke-linecap: round; }
    .arc { fill: none; stroke-linecap: round; }
    .arc.tone-normal { stroke-width: 25; filter: drop-shadow(0 0 14px var(--arc-glow)); }
    .arc.tone-normal.later { opacity: 0.26; filter: none; stroke-width: 21; }
    .arc.tone-special { stroke-width: 25; opacity: 0.62; filter: drop-shadow(0 0 12px var(--arc-glow-soft)); }
    .arc.tone-special.later { opacity: 0.16; filter: none; stroke-width: 21; }
    .arc.tone-muted { stroke-width: 13; opacity: 0.8; }
    .arc.tone-muted.later { opacity: 0.28; filter: none; stroke-width: 11; }
    .tick { stroke: rgba(255,255,255,0.22); stroke-width: 1.5; stroke-linecap: round; }
    .tick.major { stroke: rgba(255,255,255,0.66); stroke-width: 3; }
    .label { fill: rgba(247,251,255,0.88); font-size: 19px; font-weight: 550; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
    .hour-scale[data-mode="24"] .label { font-size: 15px; }
    /* Opaque so two coincident markers look like one before they split/merge. */
    .hour-mark { stroke: #8d97a7; stroke-width: 2.4; stroke-linecap: round; }
    .hour-scale { pointer-events: none; }
    .hour-hand { stroke: var(--green); stroke-width: 7; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(46,229,157,0.48)); }
    .is-tone-normal .hour-hand { stroke: var(--orange); filter: drop-shadow(0 0 10px rgba(255,107,74,0.58)); }
    .is-offday .hour-hand { stroke: var(--violet); filter: drop-shadow(0 0 10px rgba(155,135,255,0.5)); }
    .is-tone-special .hour-hand { stroke: var(--cyan); filter: drop-shadow(0 0 10px rgba(34,211,238,0.52)); }
    .minute-hand { stroke: white; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 10px rgba(255,255,255,0.55)); }
    .second-hand { stroke: var(--gold); stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 0 9px rgba(255,209,102,0.65)); }
    .hub { fill: white; filter: drop-shadow(0 0 16px rgba(255,255,255,0.9)); }

    .readout {
      position: relative;
      z-index: 1;
      width: min(360px, 100%);
      padding: 15px 20px 14px;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      background:
        linear-gradient(145deg, rgba(255,255,255,0.09), rgba(255,255,255,0.035)),
        rgba(8, 15, 28, 0.70);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 18px 42px rgba(0,0,0,0.26);
    }

    .time {
      font-size: clamp(1.55rem, 3.8vw, 2.85rem);
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 450;
    }

    .clock-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .clock-legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .clock-legend i {
      width: 22px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--c1), var(--c2));
      box-shadow: 0 0 12px var(--glow);
    }

    .clock-legend span.later i {
      opacity: 0.28;
      box-shadow: none;
    }

    .clock-legend span[hidden] { display: none; }

    .clock-legend b { font-weight: 500; }

    .clock-legend.is-empty { display: none; }

    .side-panel {
      padding: clamp(22px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .status-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--panel-strong);
    }

    .status-card > div { min-width: 0; }

    .status-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .status-body {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .status-card span,
    .timeline-label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .mode {
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      font-weight: 650;
      line-height: 1.08;
      letter-spacing: -0.03em;
      overflow-wrap: anywhere;
    }

    .badge {
      padding: 10px 12px;
      border-radius: 16px;
      font-weight: 700;
      color: #08111f;
      background: linear-gradient(135deg, var(--green), #b8f7d8);
      box-shadow: 0 0 24px rgba(46, 229, 157, 0.22);
    }

    .is-tone-normal .badge {
      background: linear-gradient(135deg, var(--orange), var(--gold));
      box-shadow: 0 0 26px rgba(255, 107, 74, 0.28);
    }

    .is-offday .badge {
      background: linear-gradient(135deg, var(--violet), #d9ccff);
      box-shadow: 0 0 24px rgba(155, 135, 255, 0.26);
    }

    .is-tone-special .badge {
      background: linear-gradient(135deg, var(--cyan), #b9f6ff);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.27);
    }

    .timeline {
      padding: 18px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.11);
      background: rgba(255,255,255,0.055);
    }

    .track {
      position: relative;
      height: 18px;
      margin: 10px 0 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.07);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .segment {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--orange), var(--gold));
      box-shadow: 0 0 20px rgba(255, 107, 74, 0.45);
    }

    .segment.tone-special {
      background: linear-gradient(90deg, var(--cyan), #8bf5dc);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.4);
    }

    .segment.tone-muted {
      background: linear-gradient(90deg, var(--green), #b8f7d8);
      box-shadow: 0 0 16px rgba(46, 229, 157, 0.35);
    }

    .now-marker {
      position: absolute;
      top: -5px;
      width: 2px;
      height: 28px;
      border-radius: 99px;
      background: white;
      box-shadow: 0 0 12px white;
      transform: translateX(-1px);
    }

    .timeline-hours {
      display: flex;
      justify-content: space-between;
      color: var(--faint);
      font-size: 0.76rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .windows {
      display: grid;
      gap: 10px;
    }

    .window {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.052);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .window em {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 13px;
      background: rgba(255, 107, 74, 0.16);
      color: #ffd5ca;
      font-style: normal;
      font-weight: 650;
    }

    .window.tone-muted em {
      background: rgba(46, 229, 157, 0.13);
      color: #b8f7d8;
    }

    .window.tone-special em {
      background: rgba(34, 211, 238, 0.15);
      color: #b9f6ff;
    }

    .window strong { display: block; font-weight: 550; }
    .window small { color: var(--muted); }
    .multiplier { color: var(--gold); font-weight: 650; }
    .window.tone-muted .multiplier { color: var(--green); }
    .window.tone-special .multiplier { color: var(--cyan); }

    .seg-toggle {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
    }

    .seg-btn {
      padding: 7px 13px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .seg-btn.is-active {
      background: var(--cyan-soft);
      color: var(--ink);
    }

    .seg-btn:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .fatal-card {
      width: min(640px, 100%);
      display: grid;
      gap: 10px;
      padding: 22px 26px;
      border: 1px solid rgba(255, 107, 74, 0.4);
      border-radius: 24px;
      background: rgba(38, 12, 10, 0.82);
      box-shadow: 0 24px 70px rgba(0,0,0,0.5);
    }

    .fatal-card h2 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--orange);
    }

    .fatal-card p { margin: 0; color: var(--muted); font-size: 0.9rem; }

    .fatal-card ul {
      margin: 0;
      padding-left: 20px;
      color: var(--ink);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
      .side-panel { order: -1; }
    }

    @media (max-width: 820px) {
      .topbar { flex-wrap: wrap; }
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .chip { justify-content: center; }
      .panel { border-radius: 26px; }
      .clock-panel, .side-panel { padding: 18px; }
      .clock-wrap { width: min(100%, 440px); }
      .readout { width: min(330px, 100%); }
      .window { grid-template-columns: auto 1fr; }
      .multiplier { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div>
          <h1 id="brandTitle">GLM-5.3-Flash off-peak clock</h1>
          <p id="brandSubtitle">Z.ai Coding Plan quota hours in your local time</p>
        </div>
      </div>
      <div class="chip"><span class="pulse"></span><span id="topStatus">Checking current window…</span></div>
    </header>

    <main class="grid">
      <section class="panel clock-panel" id="clockPanel" aria-label="12-hour local clock with variable-rate windows highlighted">
        <div class="clock-controls">
          <div class="seg-toggle" id="hourToggle" role="group" aria-label="Clock dial mode">
            <button type="button" class="seg-btn is-active" data-dial="12" aria-pressed="true">12h</button>
            <button type="button" class="seg-btn" data-dial="24" aria-pressed="false">24h</button>
          </div>
        </div>
        <div class="clock-wrap" id="clockWrap">
          <div class="orbital-glow" aria-hidden="true"></div>
          <svg id="clockSvg" viewBox="0 0 420 420" role="img" aria-labelledby="clockTitle clockDesc">
            <title id="clockTitle">Off-peak clock</title>
            <desc id="clockDesc">A 12-hour local clock. Bright colored arcs show active or upcoming variable-rate windows within 12 hours; muted arcs preview the following 12 hours.</desc>
            <defs id="gradientDefs"></defs>
            <circle class="face-fill" cx="210" cy="210" r="171" />
            <circle class="base-ring" cx="210" cy="210" r="171" />
            <circle class="quiet-ring" cx="210" cy="210" r="171" />
            <g id="laterArcs"></g>
            <g id="ticks"></g>
            <g id="futureArcs"></g>
            <line id="hourHand" class="hour-hand" x1="210" y1="210" x2="210" y2="95" />
            <line id="minuteHand" class="minute-hand" x1="210" y1="210" x2="210" y2="59" />
            <line id="secondHand" class="second-hand" x1="210" y1="210" x2="210" y2="52" />
            <circle class="hub" cx="210" cy="210" r="6.5" />
          </svg>
        </div>
        <div class="readout" aria-live="polite">
          <div>
            <div class="time" id="time">--:--:--</div>
            <div class="date" id="date">Loading local time…</div>
          </div>
        </div>
        <div class="clock-legend" id="clockLegend" aria-label="Clock arc legend"></div>
      </section>

      <section class="panel side-panel">
        <div class="status-card">
          <div class="status-head">
            <span>Current window</span>
          </div>
          <div class="status-body">
            <div class="mode" id="mode">Loading…</div>
            <div class="badge" id="badge">--</div>
          </div>
        </div>

        <div class="timeline">
          <span class="timeline-label">Next 24 hours</span>
          <div class="track" id="track"></div>
          <div class="timeline-hours"><span>now</span><span>+6h</span><span>+12h</span><span>+18h</span><span>+24h</span></div>
        </div>

        <div class="windows" id="windows"></div>
      </section>
    </main>
  </div>

  <script type="application/json" id="clockConfig">
  {
    "schemaVersion": 1,
    "timeZone": "Asia/Shanghai",
    "title": "GLM-5.3-Flash off-peak clock",
    "subtitle": "Z.ai Coding Plan quota hours in your local time",
    "offDayName": "Weekend",
    "holidays": {
      "assignTo": "offPeak",
      "name": "Public holiday",
      "dates": []
    },
    "periods": [
      {
        "key": "campaign",
        "name": "Campaign hours",
        "status": "GLM-5.3-Flash campaign hours are active now",
        "badge": "Campaign",
        "detail": "ZCode: no quota used · other agents: half rate",
        "tone": "special",
        "color": "#22d3ee",
        "color2": "#8bf5dc",
        "startDate": "2026-09-03",
        "endDate": "2026-09-20",
        "days": [0, 1, 2, 3, 4, 5, 6],
        "windows": [{ "start": "23:00", "end": "09:00" }]
      },
      {
        "key": "peak",
        "name": "Peak hours",
        "status": "Peak hours: usage counts at the standard rate",
        "badge": "1×",
        "detail": "Counts at the standard rate",
        "tone": "normal",
        "color": "#ff6b4a",
        "color2": "#ffd166",
        "days": [1, 2, 3, 4, 5],
        "windows": [{ "start": "14:00", "end": "18:00" }]
      },
      {
        "key": "offPeak",
        "name": "Off-peak hours",
        "status": "Off-peak now: usage counts at half rate",
        "badge": "0.5×",
        "detail": "Counts at half rate",
        "tone": "muted",
        "color": "#1fd37f",
        "color2": "#0fbf6b",
        "fallback": true
      }
    ]
  }
  </script>

  <script>
    const MINUTE = 60 * 1000;
    const HOUR = 60 * 60 * 1000;
    const DAY = 24 * HOUR;
    const CLOCK_CENTER = 210;
    const CLOCK_RADIUS = 171;
    const TICK_OUTER_RADIUS = 159;
    const HAND_RADII = {
      hour: 115,
      minute: 151,
      second: 158
    };
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const DIAL_TRANSITION_MS = 880;
    const DIAL_STORAGE_KEY = 'zaiClock.dial';
    const TONES = ['normal', 'special', 'muted'];
    const TONE_WEIGHT = { muted: 0, normal: 1, special: 2 };
    const scheduleFormatterCache = new Map();

    const el = {
      app: document.getElementById('app'),
      brandTitle: document.getElementById('brandTitle'),
      brandSubtitle: document.getElementById('brandSubtitle'),
      topStatus: document.getElementById('topStatus'),
      clockPanel: document.getElementById('clockPanel'),
      clockWrap: document.getElementById('clockWrap'),
      clockSvg: document.getElementById('clockSvg'),
      clockTitle: document.getElementById('clockTitle'),
      clockDesc: document.getElementById('clockDesc'),
      gradientDefs: document.getElementById('gradientDefs'),
      laterArcs: document.getElementById('laterArcs'),
      futureArcs: document.getElementById('futureArcs'),
      ticks: document.getElementById('ticks'),
      hourHand: document.getElementById('hourHand'),
      minuteHand: document.getElementById('minuteHand'),
      secondHand: document.getElementById('secondHand'),
      time: document.getElementById('time'),
      date: document.getElementById('date'),
      mode: document.getElementById('mode'),
      badge: document.getElementById('badge'),
      track: document.getElementById('track'),
      windows: document.getElementById('windows'),
      clockLegend: document.getElementById('clockLegend'),
      hourToggle: document.getElementById('hourToggle')
    };

    const fmtTime = new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit' });
    const fmtTimeSeconds = new Intl.DateTimeFormat([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const fmtDate = new Intl.DateTimeFormat([], { weekday: 'long', month: 'short', day: 'numeric' });
    const fmtShortDate = new Intl.DateTimeFormat([], { weekday: 'short', month: 'short', day: 'numeric' });
    const WEEKDAY_INDEX = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };

    // Fixed "now" for render checks: add ?at=<ISO date> to the URL.
    const debugAt = (() => {
      const value = new URLSearchParams(window.location.search).get('at');
      if (!value) return null;
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    })();
    function currentInstant() {
      return debugAt ? new Date(debugAt.getTime()) : new Date();
    }

    let clockConfig = null;
    let periodsByKey = null;
    let schedulingPeriods = null;
    let fallbackPeriod = null;
    let arcLayerOrder = null;

    function hexToRgba(hex, alpha) {
      const value = hex.replace('#', '');
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function lightenHex(hex, amount = 0.42) {
      const value = hex.replace('#', '');
      const channels = [0, 2, 4].map(offset => parseInt(value.slice(offset, offset + 2), 16));
      const mixed = channels.map(channel => Math.round(channel + (255 - channel) * amount));
      return `#${mixed.map(channel => channel.toString(16).padStart(2, '0')).join('')}`;
    }

    function validateConfig(raw) {
      const errors = [];
      const isoDate = /^\d{4}-\d{2}-\d{2}$/;
      const clockTime = /^([01]\d|2[0-3]):[0-5]\d$/;

      if (!raw || typeof raw !== 'object') return ['config must be a JSON object'];
      if (raw.schemaVersion !== 1) errors.push('schemaVersion must be 1');
      if (typeof raw.timeZone !== 'string' || !raw.timeZone) {
        errors.push('timeZone is required');
      } else {
        try {
          new Intl.DateTimeFormat('en-US', { timeZone: raw.timeZone });
        } catch (e) {
          errors.push(`timeZone "${raw.timeZone}" is not a valid IANA zone`);
        }
      }
      if (typeof raw.title !== 'string' || !raw.title) errors.push('title is required');
      if (typeof raw.subtitle !== 'string' || !raw.subtitle) errors.push('subtitle is required');
      if (raw.offDayName !== undefined && typeof raw.offDayName !== 'string') {
        errors.push('offDayName must be a string');
      }

      const periods = Array.isArray(raw.periods) ? raw.periods : [];
      if (!periods.length) errors.push('periods must be a non-empty array');

      const keys = periods.map(period => period.key);
      if (keys.some(key => typeof key !== 'string' || !key)) errors.push('every period needs a string key');
      if (new Set(keys).size !== keys.length) errors.push('period keys must be unique');

      const fallbacks = periods.filter(period => period.fallback);
      if (fallbacks.length !== 1) errors.push('exactly one period must set "fallback": true');

      for (const period of periods) {
        const label = period.key || 'unknown';
        for (const field of ['name', 'badge', 'status']) {
          if (typeof period[field] !== 'string' || !period[field]) errors.push(`${label}: ${field} is required`);
        }
        if (!TONES.includes(period.tone)) errors.push(`${label}: tone must be one of ${TONES.join(', ')}`);
        if (typeof period.color !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(period.color)) {
          errors.push(`${label}: color must be a #rrggbb hex value`);
        }
        if (period.color2 !== undefined && !/^#[0-9a-fA-F]{6}$/.test(period.color2)) {
          errors.push(`${label}: color2 must be a #rrggbb hex value`);
        }

        if (period.fallback) {
          if (period.days !== undefined || period.windows !== undefined ||
              period.startDate !== undefined || period.endDate !== undefined) {
            errors.push(`${label}: fallback period must not define days/windows/startDate/endDate`);
          }
          continue;
        }

        if (!Array.isArray(period.days) || period.days.length === 0 ||
            period.days.some(day => !Number.isInteger(day) || day < 0 || day > 6)) {
          errors.push(`${label}: days must be a non-empty array of weekday numbers 0-6`);
        }
        if (!Array.isArray(period.windows) || period.windows.length === 0) {
          errors.push(`${label}: windows must be a non-empty array`);
        } else {
          for (const window of period.windows) {
            if (!window || !clockTime.test(window.start || '') || !clockTime.test(window.end || '') ||
                window.start === window.end) {
              errors.push(`${label}: windows need distinct "HH:MM" start/end values`);
            }
          }
        }
        for (const field of ['startDate', 'endDate']) {
          if (period[field] !== undefined && !isoDate.test(period[field])) {
            errors.push(`${label}: ${field} must be YYYY-MM-DD`);
          }
        }
        if (isoDate.test(period.startDate || '') && isoDate.test(period.endDate || '') &&
            period.startDate > period.endDate) {
          errors.push(`${label}: startDate must not be after endDate`);
        }
      }

      const holidays = raw.holidays;
      if (holidays !== undefined) {
        if (!holidays || typeof holidays !== 'object') errors.push('holidays must be an object');
        if ((holidays?.dates?.length || 0) > 0) {
          if (!keys.includes(holidays.assignTo)) errors.push('holidays.assignTo must name an existing period');
          for (const date of holidays.dates) {
            if (!isoDate.test(date)) errors.push(`holiday date "${date}" must be YYYY-MM-DD`);
          }
        }
      }

      return errors;
    }

    function applyConfig(raw) {
      clockConfig = raw;
      offDayCache.clear();
      lastTimelineMinute = '';
      periodsByKey = new Map(raw.periods.map(period => [period.key, period]));
      schedulingPeriods = raw.periods.filter(period => !period.fallback);
      fallbackPeriod = raw.periods.find(period => period.fallback);
      // Muted arcs render underneath, special on top; config order breaks ties.
      arcLayerOrder = [...raw.periods].sort((a, b) =>
        (TONE_WEIGHT[a.tone] - TONE_WEIGHT[b.tone]) || (raw.periods.indexOf(a) - raw.periods.indexOf(b)));

      const rootStyle = document.documentElement.style;
      for (const period of raw.periods) {
        const color2 = period.color2 || lightenHex(period.color);
        rootStyle.setProperty(`--period-${period.key}`, period.color);
        rootStyle.setProperty(`--period-${period.key}-2`, color2);
      }
    }

    function buildGradientDefs() {
      el.gradientDefs.replaceChildren();
      for (const period of clockConfig.periods) {
        const color2 = period.color2 || lightenHex(period.color);
        const gradient = document.createElementNS(SVG_NS, 'linearGradient');
        gradient.id = `grad-${period.key}`;
        gradient.setAttribute('x1', '0%');
        gradient.setAttribute('x2', '100%');
        gradient.setAttribute('y1', '0%');
        gradient.setAttribute('y2', '100%');
        for (const [offset, color] of [['0%', period.color], ['100%', color2]]) {
          const stop = document.createElementNS(SVG_NS, 'stop');
          stop.setAttribute('offset', offset);
          stop.setAttribute('stop-color', color);
          gradient.appendChild(stop);
        }
        el.gradientDefs.appendChild(gradient);
      }
    }

    function buildArcLayerGroups() {
      el.laterArcs.replaceChildren();
      el.futureArcs.replaceChildren();
      for (const period of arcLayerOrder) {
        for (const parent of [el.laterArcs, el.futureArcs]) {
          const group = createSvgElement('g', 'arc-layer');
          group.dataset.period = period.key;
          group.style.setProperty('--arc-glow', hexToRgba(period.color, 0.55));
          group.style.setProperty('--arc-glow-soft', hexToRgba(period.color, 0.3));
          parent.appendChild(group);
        }
      }
    }

    function arcLayerGroup(horizon, key) {
      return (horizon === 'later' ? el.laterArcs : el.futureArcs)
        .querySelector(`.arc-layer[data-period="${key}"]`);
    }

    // Schedule evaluation happens in the config timezone; the browser-local
    // zone is display-only.
    function scheduleFormatter(timeZone) {
      if (!scheduleFormatterCache.has(timeZone)) {
        scheduleFormatterCache.set(timeZone, new Intl.DateTimeFormat('en-US', {
          timeZone,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          weekday: 'short',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hourCycle: 'h23'
        }));
      }
      return scheduleFormatterCache.get(timeZone);
    }

    function zonedParts(date, timeZone) {
      const values = {};
      for (const part of scheduleFormatter(timeZone).formatToParts(date)) {
        if (part.type !== 'literal') values[part.type] = part.value;
      }
      const hour = Number(values.hour) % 24;
      return {
        year: Number(values.year),
        month: Number(values.month),
        day: Number(values.day),
        weekday: WEEKDAY_INDEX[values.weekday],
        minute: hour * 60 + Number(values.minute) + Number(values.second) / 60
      };
    }

    function scheduleParts(date) {
      return zonedParts(date, clockConfig.timeZone);
    }

    function calendarDateNumber({ year, month, day }) {
      return Math.floor(Date.UTC(year, month - 1, day) / DAY);
    }

    function isoDateNumber(value) {
      const [year, month, day] = value.split('-').map(Number);
      return calendarDateNumber({ year, month, day });
    }

    function holidayDates() {
      return (clockConfig.holidays && clockConfig.holidays.dates) || [];
    }

    function isHoliday(date) {
      const parts = scheduleParts(date);
      const key = `${parts.year}-${String(parts.month).padStart(2, '0')}-${String(parts.day).padStart(2, '0')}`;
      return holidayDates().includes(key);
    }

    // A wrapping window (start > end) anchors to the day its start lies in, so
    // both the weekday and date-range checks use that anchor.
    function periodMatches(period, date) {
      const parts = scheduleParts(date);
      for (const window of period.windows) {
        const start = parseClockMinutes(window.start);
        const end = parseClockMinutes(window.end);
        let weekday = parts.weekday;
        let dateNumber = calendarDateNumber(parts);
        let matchesTime = false;

        if (start < end) {
          matchesTime = parts.minute >= start && parts.minute < end;
        } else if (parts.minute >= start) {
          matchesTime = true;
        } else if (parts.minute < end) {
          matchesTime = true;
          weekday = (weekday + 6) % 7;
          dateNumber -= 1;
        }

        if (!matchesTime) continue;
        if (!period.days.includes(weekday)) continue;
        if (period.startDate && dateNumber < isoDateNumber(period.startDate)) continue;
        if (period.endDate && dateNumber > isoDateNumber(period.endDate)) continue;
        return true;
      }
      return false;
    }

    function parseClockMinutes(value) {
      const [hour, minute] = value.split(':').map(Number);
      return hour * 60 + minute;
    }

    function periodKeyAt(date) {
      // Holidays collapse to their assigned period before any window match,
      // overriding even date-ranged periods.
      if (isHoliday(date)) return clockConfig.holidays.assignTo;
      for (const period of schedulingPeriods) {
        if (periodMatches(period, date)) return period.key;
      }
      return fallbackPeriod.key;
    }

    function periodOf(key) {
      return periodsByKey.get(key);
    }

    // Today (config timezone) is an off day when no scheduled non-fallback
    // window touches it anywhere — expired date ranges therefore stop covering
    // their weekdays. Memoized per config-timezone date key.
    const offDayCache = new Map();

    function zonedDayStart(date) {
      const parts = scheduleParts(date);
      let guess = Date.UTC(parts.year, parts.month - 1, parts.day);
      for (let i = 0; i < 2; i++) {
        const wall = zonedParts(new Date(guess), clockConfig.timeZone);
        const offset = wall.minute;
        if (offset === 0) break;
        guess -= offset * MINUTE;
      }
      return guess;
    }

    function isOffDay(date) {
      if (isHoliday(date)) return true;
      const parts = scheduleParts(date);
      const key = `${parts.year}-${String(parts.month).padStart(2, '0')}-${String(parts.day).padStart(2, '0')}`;
      if (offDayCache.has(key)) return offDayCache.get(key);

      const dayStart = zonedDayStart(date);
      let touched = false;
      for (let t = dayStart; t < dayStart + DAY && !touched; t += MINUTE) {
        touched = schedulingPeriods.some(period => periodMatches(period, new Date(t)));
      }
      offDayCache.set(key, !touched);
      return !touched;
    }

    function intervalsBetween(rangeStart, rangeEnd, predicate, clip = true) {
      const intervals = [];
      const scanStart = Math.floor((rangeStart.getTime() - DAY) / MINUTE) * MINUTE;
      const scanEnd = Math.ceil((rangeEnd.getTime() + DAY) / MINUTE) * MINUTE;
      let active = predicate(new Date(scanStart));
      let actualStart = active ? new Date(scanStart) : null;

      for (let t = scanStart + MINUTE; t <= scanEnd; t += MINUTE) {
        const nextActive = predicate(new Date(t));
        if (!active && nextActive) actualStart = new Date(t);
        if (active && !nextActive && actualStart) {
          const actualEnd = new Date(t);
          if (actualEnd > rangeStart && actualStart < rangeEnd) {
            const start = clip ? new Date(Math.max(actualStart, rangeStart)) : actualStart;
            const end = clip ? new Date(Math.min(actualEnd, rangeEnd)) : actualEnd;
            if (end > start) intervals.push({ start, end, actualStart, actualEnd });
          }
          actualStart = null;
        }
        active = nextActive;
      }

      return intervals.sort((a, b) => a.start - b.start);
    }

    function periodIntervalsBetween(key, rangeStart, rangeEnd, clip = true) {
      return intervalsBetween(rangeStart, rangeEnd, date => periodKeyAt(date) === key, clip);
    }

    function point(cx, cy, r, angleDeg) {
      const angle = (angleDeg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    }

    // Dial geometry. The active dial (12h or 24h) changes the hour-hand speed and
    // hour labels; the minute and second hands always do one revolution per
    // minute/hour regardless of dial type.
    let dialHours = 12;
    let dialTransitioning = false;

    function dialRange(hours = dialHours) {
      return hours * 60;
    }

    function angleForDialMinutes(minutes, hours = dialHours) {
      // dialRange() minutes maps to 360° so arc endpoints land on the dial.
      return minutes / dialRange(hours) * 360;
    }

    function angleForMinute(minute) {
      return minute / 60 * 360;
    }

    function angleForSecond(second) {
      return second / 60 * 360;
    }

    function wallMinute(date) {
      return date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60 + date.getMilliseconds() / 60000;
    }

    // Position of a moment on the active dial: the 12h dial wraps every 12h
    // (hours % 12), the 24h dial wraps every 24h.
    function dialMinutesOf(date, hours = dialHours) {
      const range = dialRange(hours);
      return (wallMinute(date) % range + range) % range;
    }

    // Hour hand: one revolution per 12h (12h dial) or per 24h (24h dial = 2× slower).
    function hourHandAngle(date, hours = dialHours) {
      return angleForDialMinutes(dialMinutesOf(date, hours), hours);
    }

    function setHourHandAngle(angle) {
      const end = point(CLOCK_CENTER, CLOCK_CENTER, HAND_RADII.hour, angle);
      el.hourHand.setAttribute('x2', end.x.toFixed(2));
      el.hourHand.setAttribute('y2', end.y.toFixed(2));
    }

    function arcPathFromAngles(startAngle, endAngle, r = CLOCK_RADIUS) {
      if (endAngle <= startAngle) return '';
      const start = point(CLOCK_CENTER, CLOCK_CENTER, r, startAngle);
      const end = point(CLOCK_CENTER, CLOCK_CENTER, r, endAngle);
      const span = endAngle - startAngle;

      // An SVG arc whose endpoints are identical renders nothing. Split a
      // complete dial into two semicircles so windows lasting at least one
      // whole 12h/24h cycle remain visible.
      if (span >= 359.999) {
        const midpoint = point(CLOCK_CENTER, CLOCK_CENTER, r, startAngle + 180);
        return `M ${start.x.toFixed(3)} ${start.y.toFixed(3)} ` +
          `A ${r} ${r} 0 0 1 ${midpoint.x.toFixed(3)} ${midpoint.y.toFixed(3)} ` +
          `A ${r} ${r} 0 0 1 ${start.x.toFixed(3)} ${start.y.toFixed(3)}`;
      }

      const largeArc = span <= 180 ? 0 : 1;
      return `M ${start.x.toFixed(3)} ${start.y.toFixed(3)} A ${r} ${r} 0 ${largeArc} 1 ${end.x.toFixed(3)} ${end.y.toFixed(3)}`;
    }

    function arcPath(startMinute, endMinute, r = CLOCK_RADIUS, hours = dialHours) {
      return arcPathFromAngles(
        angleForDialMinutes(startMinute, hours),
        angleForDialMinutes(endMinute, hours),
        r
      );
    }

    function sameLocalDate(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function formatWindow(start, end, reference = new Date()) {
      const range = `${fmtTime.format(start)}–${fmtTime.format(end)}`;
      if (sameLocalDate(start, end) && sameLocalDate(start, reference)) return range;
      if (sameLocalDate(start, end)) return `${range}, ${fmtShortDate.format(start)}`;
      return `${fmtTime.format(start)}, ${fmtShortDate.format(start)} – ${fmtTime.format(end)}, ${fmtShortDate.format(end)}`;
    }

    function dialMinuteFragments(start, end, hours = dialHours) {
      const range = dialRange(hours);
      const startMinute = dialMinutesOf(start, hours);
      const endMinute = dialMinutesOf(end, hours);
      const parts = [];

      if (Math.abs(end - start) >= range * 60000) {
        parts.push([0, range]);
      } else if (endMinute > startMinute) {
        parts.push([startMinute, endMinute]);
      } else {
        parts.push([startMinute, range], [0, endMinute]);
      }

      return parts.filter(([a, b]) => b - a > 0.35);
    }

    function mergeMinuteFragments(fragments) {
      const sorted = fragments
        .filter(([a, b]) => b - a > 0.35)
        .sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const fragment of sorted) {
        const previous = merged[merged.length - 1];
        if (!previous || fragment[0] > previous[1] + 0.35) {
          merged.push([...fragment]);
        } else {
          previous[1] = Math.max(previous[1], fragment[1]);
        }
      }
      return merged;
    }

    function subtractMinuteFragments(fragments, exclusions) {
      let result = fragments.map(fragment => [...fragment]);
      for (const [excludeStart, excludeEnd] of exclusions) {
        result = result.flatMap(([start, end]) => {
          if (excludeEnd <= start || excludeStart >= end) return [[start, end]];
          const remainder = [];
          if (excludeStart - start > 0.35) remainder.push([start, excludeStart]);
          if (end - excludeEnd > 0.35) remainder.push([excludeEnd, end]);
          return remainder;
        });
      }
      return result;
    }

    function joinWrappedFragments(fragments, hours = dialHours) {
      const range = dialRange(hours);
      const sorted = fragments.map(fragment => [...fragment]).sort((a, b) => a[0] - b[0]);
      if (sorted.length < 2) return sorted;

      const first = sorted[0];
      const last = sorted[sorted.length - 1];
      if (first[0] > 0.35 || range - last[1] > 0.35) return sorted;

      return [[last[0], first[1] + range], ...sorted.slice(1, -1)];
    }

    function fragmentPaths(period, fragments, horizonClass, hours = dialHours) {
      const stroke = `url(#grad-${period.key})`;
      return joinWrappedFragments(fragments, hours)
        .map(([start, end]) =>
          `<path class="arc tone-${period.tone} ${horizonClass}" stroke="${stroke}" d="${arcPath(start, end, CLOCK_RADIUS, hours)}" />`)
        .join('');
    }

    function roundClockFragments(now, key, hours = dialHours) {
      const horizonEnd = new Date(now.getTime() + hours * HOUR);
      const followingEnd = new Date(now.getTime() + hours * 2 * HOUR);
      const nearIntervals = periodIntervalsBetween(key, now, horizonEnd, true);
      const laterIntervals = periodIntervalsBetween(key, horizonEnd, followingEnd, true);

      // Keep the complete active window bright when it fits unambiguously on
      // the selected dial. Longer windows wrap a 12h dial, so show only their
      // remaining planning-horizon portion instead of implying a full-day rate.
      const near = mergeMinuteFragments(nearIntervals.flatMap(interval => {
        const activeNow = interval.actualStart < now && interval.actualEnd > now;
        const completeWindowFits = interval.actualEnd - interval.actualStart <= hours * HOUR;
        const start = activeNow && completeWindowFits
          ? interval.actualStart
          : interval.start;
        return dialMinuteFragments(start, interval.end, hours);
      }));

      // Preview one additional dial cycle as muted. Bright nearer peaks win at
      // shared rim positions, avoiding the double overlays of repeated windows.
      const later = mergeMinuteFragments(laterIntervals.flatMap(interval =>
        dialMinuteFragments(interval.start, interval.end, hours)
      ));
      return { near, later: subtractMinuteFragments(later, near) };
    }

    function renderLegend(arcPresence) {
      el.clockLegend.innerHTML = clockConfig.periods.map(period => {
        const vars = ` style="--c1: var(--period-${period.key}); --c2: var(--period-${period.key}-2); --glow: ${hexToRgba(period.color, 0.45)}"`;
        const nearHidden = arcPresence[period.key].near ? '' : ' hidden';
        const laterHidden = arcPresence[period.key].later ? '' : ' hidden';
        return `<span${vars}${nearHidden}><i></i><b>${period.name} · next ${dialHours}h</b></span>` +
          `<span class="later"${vars}${laterHidden}><i></i><b>${period.name} · ${dialHours}–${dialHours * 2}h from now</b></span>`;
      }).join('');
      el.clockLegend.classList.toggle('is-empty',
        !clockConfig.periods.some(period => arcPresence[period.key].near || arcPresence[period.key].later));
    }

    function drawRoundClock(now) {
      const arcPresence = {};
      for (const period of arcLayerOrder) {
        const fragments = roundClockFragments(now, period.key, dialHours);
        arcLayerGroup('future', period.key).innerHTML = fragmentPaths(period, fragments.near, 'future', dialHours);
        arcLayerGroup('later', period.key).innerHTML = fragmentPaths(period, fragments.later, 'later', dialHours);
        arcPresence[period.key] = {
          near: fragments.near.length > 0,
          later: fragments.later.length > 0
        };
      }
      renderLegend(arcPresence);
    }

    function splitArcFragmentsAtHalf(fragments, mode) {
      if (mode === 12) return fragments.map(fragment => [...fragment]);
      return fragments.flatMap(([start, end]) => {
        if (start < 720 && end > 720) return [[start, 720], [720, end]];
        return [[start, end]];
      });
    }

    function canonicalArcAngle(minute, mode, fragmentStart) {
      if (mode === 24) return minute / 1440 * 360;
      const halfStart = Math.floor(fragmentStart / 720) * 720;
      return (minute - halfStart) / 720 * 360;
    }

    function directedArcTarget(fromAngle, targetAngle, clockwise) {
      if (clockwise) {
        while (targetAngle < fromAngle) targetAngle += 360;
      } else {
        while (targetAngle > fromAngle) targetAngle -= 360;
      }
      return targetAngle;
    }

    function createArcTweenLayer(parent, fragments, modelMode, period, horizonClass, layerName) {
      const layer = createSvgElement('g', `arc-tween-layer ${layerName}`);
      const joinedFragments = joinWrappedFragments(fragments, modelMode);
      const stroke = `url(#grad-${period.key})`;
      const paths = splitArcFragmentsAtHalf(joinedFragments, modelMode).map(([start, end]) => {
        const path = createSvgElement('path', `arc tone-${period.tone} ${horizonClass}`);
        path.setAttribute('stroke', stroke);
        layer.appendChild(path);
        return { path, start, end, tween: null };
      });
      parent.appendChild(layer);
      return { layer, paths };
    }

    function updateArcTweenLayer(record, fromMode, toMode, progress, clockwise) {
      for (const entry of record.paths) {
        if (!entry.tween) {
          const { start, end } = entry;
          const fromStart = canonicalArcAngle(start, fromMode, start);
          const fromEnd = canonicalArcAngle(end, fromMode, start);
          const toStart = canonicalArcAngle(start, toMode, start);
          const toEnd = canonicalArcAngle(end, toMode, start);
          const fromCenter = (fromStart + fromEnd) / 2;
          entry.tween = {
            fromCenter,
            targetCenter: directedArcTarget(fromCenter, (toStart + toEnd) / 2, clockwise),
            fromSpan: fromEnd - fromStart,
            toSpan: toEnd - toStart
          };
        }
        const { fromCenter, targetCenter, fromSpan, toSpan } = entry.tween;
        const center = fromCenter + (targetCenter - fromCenter) * progress;
        const span = fromSpan + (toSpan - fromSpan) * progress;
        entry.path.setAttribute('d', arcPathFromAngles(center - span / 2, center + span / 2));
      }
    }

    function prepareArcsTransition(now, fromMode, toMode) {
      const outgoing = [];
      const incoming = [];
      for (const period of arcLayerOrder) {
        const outgoingFragments = roundClockFragments(now, period.key, fromMode);
        const incomingFragments = roundClockFragments(now, period.key, toMode);
        for (const horizon of ['later', 'future']) {
          const parent = arcLayerGroup(horizon, period.key);
          parent.replaceChildren();
          outgoing.push(createArcTweenLayer(parent, outgoingFragments[horizon === 'later' ? 'later' : 'near'], fromMode, period, horizon, 'outgoing'));
          incoming.push(createArcTweenLayer(parent, incomingFragments[horizon === 'later' ? 'later' : 'near'], toMode, period, horizon, 'incoming'));
        }
      }
      for (const record of incoming) record.layer.setAttribute('opacity', '0');

      const clockwise = fromMode === 12 && toMode === 24;
      const hasArcs = [...outgoing, ...incoming].some(record => record.paths.length > 0);
      el.clockLegend.classList.toggle('is-empty', !hasArcs);

      const update = progress => {
        // The outer rim has one consistent direction: clockwise into 24h and
        // anti-clockwise back into 12h. Both endpoint angles follow that route.
        for (const record of [...outgoing, ...incoming]) {
          updateArcTweenLayer(record, fromMode, toMode, progress, clockwise);
        }
        for (const record of outgoing) record.layer.setAttribute('opacity', (1 - progress).toFixed(3));
        for (const record of incoming) record.layer.setAttribute('opacity', progress.toFixed(3));
      };

      update(0);
      return update;
    }

    function createSvgElement(tag, className) {
      const node = document.createElementNS(SVG_NS, tag);
      if (className) node.setAttribute('class', className);
      return node;
    }

    function appendMinuteTicks() {
      const group = createSvgElement('g', 'minute-ticks');
      // Minute ticks remain fixed: the minute and second hands have the same
      // geometry in both dial styles.
      for (let i = 0; i < 60; i++) {
        const angle = angleForMinute(i);
        const major = i % 5 === 0;
        const a = point(CLOCK_CENTER, CLOCK_CENTER, major ? 139 : 151, angle);
        const b = point(CLOCK_CENTER, CLOCK_CENTER, TICK_OUTER_RADIUS, angle);
        const tick = createSvgElement('line', `tick${major ? ' major' : ''}`);
        tick.setAttribute('x1', a.x.toFixed(2));
        tick.setAttribute('y1', a.y.toFixed(2));
        tick.setAttribute('x2', b.x.toFixed(2));
        tick.setAttribute('y2', b.y.toFixed(2));
        group.appendChild(tick);
      }
      el.ticks.appendChild(group);
    }

    function positionHourScaleItem(item, angle) {
      const mark = item.querySelector('.hour-mark');
      const label = item.querySelector('.label');
      if (mark) {
        const markStart = point(CLOCK_CENTER, CLOCK_CENTER, 132, angle);
        const markEnd = point(CLOCK_CENTER, CLOCK_CENTER, 143, angle);
        mark.setAttribute('x1', markStart.x.toFixed(2));
        mark.setAttribute('y1', markStart.y.toFixed(2));
        mark.setAttribute('x2', markEnd.x.toFixed(2));
        mark.setAttribute('y2', markEnd.y.toFixed(2));
      }
      if (label) {
        const labelPoint = point(CLOCK_CENTER, CLOCK_CENTER, 119, angle);
        label.setAttribute('x', labelPoint.x.toFixed(2));
        label.setAttribute('y', labelPoint.y.toFixed(2));
      }
    }

    function createHourScaleLayer(mode, angleForHour, { marks = true, labels = true } = {}) {
      const layer = createSvgElement('g', 'hour-scale');
      layer.dataset.mode = String(mode);
      for (let h = 0; h < mode; h++) {
        const item = createSvgElement('g', 'hour-scale-item');
        item.dataset.hour = String(h);
        if (marks) item.appendChild(createSvgElement('line', 'hour-mark'));
        if (labels) {
          const label = createSvgElement('text', 'label');
          label.textContent = mode === 24 && h === 0 ? '24' : (mode === 12 && h === 0 ? '12' : String(h));
          item.appendChild(label);
        }
        positionHourScaleItem(item, angleForHour(h));
        layer.appendChild(item);
      }
      return layer;
    }

    function hourScaleLabels(layer) {
      return Array.from(layer.querySelectorAll('.label'));
    }

    function setHourScaleLabelOpacity(layerOrLabels, opacity) {
      const labels = Array.isArray(layerOrLabels) ? layerOrLabels : hourScaleLabels(layerOrLabels);
      const value = opacity.toFixed(3);
      for (const label of labels) label.setAttribute('opacity', value);
    }

    function hourScaleTween(layer, fromAngle, toAngle) {
      // Resolve items, marks, labels and both angles once; frames then only
      // write attributes. Deliberately interpolate the signed angle directly:
      // on 12→24 the 0–11 half travels anti-clockwise while 12–23 travels
      // clockwise; the reverse transition swaps directions and merges halves.
      return Array.from(layer.querySelectorAll('.hour-scale-item')).map(item => {
        const hour = Number(item.dataset.hour);
        return {
          mark: item.querySelector('.hour-mark'),
          label: item.querySelector('.label'),
          from: fromAngle(hour),
          to: toAngle(hour)
        };
      });
    }

    function positionHourScaleTween(entry, angle) {
      if (entry.mark) {
        const markStart = point(CLOCK_CENTER, CLOCK_CENTER, 132, angle);
        const markEnd = point(CLOCK_CENTER, CLOCK_CENTER, 143, angle);
        entry.mark.setAttribute('x1', markStart.x.toFixed(2));
        entry.mark.setAttribute('y1', markStart.y.toFixed(2));
        entry.mark.setAttribute('x2', markEnd.x.toFixed(2));
        entry.mark.setAttribute('y2', markEnd.y.toFixed(2));
      }
      if (entry.label) {
        const labelPoint = point(CLOCK_CENTER, CLOCK_CENTER, 119, angle);
        entry.label.setAttribute('x', labelPoint.x.toFixed(2));
        entry.label.setAttribute('y', labelPoint.y.toFixed(2));
      }
    }

    function updateHourScaleAngles(tween, progress) {
      for (const entry of tween) {
        positionHourScaleTween(entry, entry.from + (entry.to - entry.from) * progress);
      }
    }

    function drawTicks() {
      el.ticks.replaceChildren();
      appendMinuteTicks();
      el.ticks.appendChild(createHourScaleLayer(dialHours, h => h / dialHours * 360));
    }

    function prepareDialScaleTransition(fromMode, toMode) {
      el.ticks.replaceChildren();
      appendMinuteTicks();

      if (fromMode === 12 && toMode === 24) {
        // The old layer contributes labels only. The 24-marker layer starts as
        // 12 opaque pairs at identical positions, so each visible marker truly
        // splits and travels into its AM/PM destination without fading.
        const outgoing = createHourScaleLayer(12, h => h * 30, { marks: false });
        const moving = createHourScaleLayer(24, h => (h % 12) * 30);
        el.ticks.append(outgoing, moving);
        const outgoingLabels = hourScaleLabels(outgoing);
        const movingLabels = hourScaleLabels(moving);
        const tween = hourScaleTween(moving, h => (h % 12) * 30, h => h * 15);
        setHourScaleLabelOpacity(movingLabels, 0);
        return progress => {
          const blend = Math.min(1, progress * 1.8);
          setHourScaleLabelOpacity(outgoingLabels, 1 - blend);
          setHourScaleLabelOpacity(movingLabels, blend);
          updateHourScaleAngles(tween, progress);
        };
      }

      // In reverse, all 24 opaque markers physically converge into 12 pairs.
      // Only their numbers fade while a single 12h label set appears.
      const moving = createHourScaleLayer(24, h => h * 15);
      const incoming = createHourScaleLayer(12, h => h * 30, { marks: false });
      el.ticks.append(moving, incoming);
      const movingLabels = hourScaleLabels(moving);
      const incomingLabels = hourScaleLabels(incoming);
      const tween = hourScaleTween(moving, h => h * 15, h => (h % 12) * 30);
      setHourScaleLabelOpacity(incomingLabels, 0);
      return progress => {
        const blend = Math.min(1, progress * 1.8);
        setHourScaleLabelOpacity(movingLabels, 1 - blend);
        setHourScaleLabelOpacity(incomingLabels, blend);
        updateHourScaleAngles(tween, progress);
      };
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function pricingPeriodsBetween(rangeStart, rangeEnd) {
      const periods = [];
      let cursor = new Date(rangeStart);

      // Include every period that intersects the next-24h horizon, but end it
      // at its real schedule boundary. The final row may therefore extend past
      // +24h instead of presenting the viewport edge as a pricing change.
      while (cursor < rangeEnd) {
        const periodKey = periodKeyAt(cursor);
        const boundary = nextBoundary(cursor);
        const periodEnd = boundary || new Date(rangeEnd);
        periods.push({
          start: new Date(cursor),
          end: periodEnd,
          periodKey
        });
        if (periodEnd <= cursor) break;
        cursor = periodEnd;
      }

      return periods.filter(period => period.end > period.start);
    }

    // The listing must always show at least two entries, even when the next
    // schedule boundary lies beyond the 24h horizon (e.g. a long weekend).
    // Within 24h, show every interval; if that's fewer than two, extend the
    // horizon and return only the next two entries to keep the list short.
    function outlookPeriods(now) {
      const within24 = pricingPeriodsBetween(now, new Date(now.getTime() + DAY));
      if (within24.length >= 2) return within24;
      let horizon = DAY;
      let periods = within24;
      for (let guard = 0; periods.length < 2 && guard < 8; guard++) {
        horizon += DAY;
        periods = pricingPeriodsBetween(now, new Date(now.getTime() + horizon));
      }
      return periods.slice(0, 2);
    }

    function drawNext24(now) {
      const end = new Date(now.getTime() + DAY);
      const pricingPeriods = pricingPeriodsBetween(now, end);
      const intervals = pricingPeriods.map(period => ({
        ...period,
        start: new Date(Math.max(period.start, now)),
        end: new Date(Math.min(period.end, end))
      })).filter(period => period.end > period.start);

      el.track.innerHTML = '<i class="now-marker" id="nowMarker" style="left:0%"></i>' + intervals.map(({ start, end, periodKey }) => {
        const left = Math.max(0, (start - now) / DAY * 100);
        const width = Math.max(0.7, (end - start) / DAY * 100);
        const tone = periodOf(periodKey).tone;
        return `<i class="segment tone-${tone}" style="left:${left}%;width:${width}%"></i>`;
      }).join('');

      el.windows.innerHTML = outlookPeriods(now).map((pricingPeriod, index) => {
        const period = periodOf(pricingPeriod.periodKey);
        const hours = ((pricingPeriod.end - pricingPeriod.start) / HOUR).toLocaleString([], { maximumFractionDigits: 1 });
        const current = pricingPeriod.start.getTime() === now.getTime();
        const detail = period.detail || period.name;
        const descriptor = current
          ? `${hours}h remaining · ${detail}`
          : `${hours}h · ${detail}`;
        return `<div class="window tone-${period.tone}"><em>${index + 1}</em><div><strong>${formatWindow(pricingPeriod.start, pricingPeriod.end, now)}</strong><small>${descriptor}</small></div><div class="multiplier">${period.badge}</div></div>`;
      }).join('');
    }

    function nextBoundary(now) {
      // A full eight-day scan covers any weekly recurring schedule.
      const scanUntil = new Date(now.getTime() + 8 * DAY);
      const cursor = new Date(now.getTime());
      cursor.setSeconds(0, 0);
      cursor.setMinutes(cursor.getMinutes() + (cursor <= now ? 1 : 0));

      for (let t = cursor.getTime(); t <= scanUntil.getTime(); t += 60000) {
        const before = periodKeyAt(new Date(t - 1));
        const after = periodKeyAt(new Date(t));
        if (before !== after) return new Date(t);
      }

      return null;
    }

    let lastTimelineMinute = '';

    function update() {
      const now = currentInstant();
      const timelineMinute = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}-${now.getMinutes()}`;
      if (timelineMinute !== lastTimelineMinute) {
        drawNext24(now);
        if (!dialTransitioning) drawRoundClock(now);
        lastTimelineMinute = timelineMinute;
      }

      const periodKey = periodKeyAt(now);
      const period = periodOf(periodKey);
      const offDay = isOffDay(now);
      const offDayName = isHoliday(now)
        ? (clockConfig.holidays && clockConfig.holidays.name) || 'Public holiday'
        : clockConfig.offDayName;
      // Interpolate the hour and minute hands between markings like a real
      // analog clock; the second hand stays on its visible whole-second mark.
      const minute = now.getMinutes() + now.getSeconds() / 60 + now.getMilliseconds() / 60000;
      // Second markers are whole-second ticks, so keep this hand exactly on
      // the visible second mark rather than drifting between two marks.
      const second = now.getSeconds();
      if (!dialTransitioning) setHourHandAngle(hourHandAngle(now));
      const minuteEnd = point(CLOCK_CENTER, CLOCK_CENTER, HAND_RADII.minute, angleForMinute(minute));
      const secondEnd = point(CLOCK_CENTER, CLOCK_CENTER, HAND_RADII.second, angleForSecond(second));
      el.minuteHand.setAttribute('x2', minuteEnd.x.toFixed(2));
      el.minuteHand.setAttribute('y2', minuteEnd.y.toFixed(2));
      el.secondHand.setAttribute('x2', secondEnd.x.toFixed(2));
      el.secondHand.setAttribute('y2', secondEnd.y.toFixed(2));

      el.time.textContent = fmtTimeSeconds.format(now);
      el.date.textContent = fmtDate.format(now);
      for (const tone of TONES) el.app.classList.toggle(`is-tone-${tone}`, tone === period.tone);
      el.app.classList.toggle('is-offday', offDay);
      el.topStatus.textContent = period.status;
      el.mode.textContent = offDay && offDayName
        ? `${offDayName} · ${period.name}`
        : period.name;
      el.badge.textContent = period.badge;
    }

    function loadDialMode() {
      try {
        return Number(localStorage.getItem(DIAL_STORAGE_KEY)) === 24 ? 24 : 12;
      } catch (e) {
        return 12;
      }
    }

    function saveDialMode(mode) {
      try {
        localStorage.setItem(DIAL_STORAGE_KEY, String(mode));
      } catch (e) {
        /* Storage unavailable; ignore. */
      }
    }

    function updateDialModeUi() {
      const is24 = dialHours === 24;
      el.clockDesc.textContent = is24
        ? 'A 24-hour local clock. Bright colored arcs show active or upcoming variable-rate windows within 24 hours; muted arcs show windows 24 to 48 hours from now.'
        : 'A 12-hour local clock. Bright colored arcs show active or upcoming variable-rate windows within 12 hours; muted arcs show windows 12 to 24 hours from now.';
      el.clockPanel.setAttribute('aria-label', is24 ? '24-hour local clock with variable-rate windows highlighted' : '12-hour local clock with variable-rate windows highlighted');
      el.clockSvg.setAttribute('aria-busy', dialTransitioning ? 'true' : 'false');
      for (const btn of el.hourToggle.querySelectorAll('.seg-btn')) {
        const active = Number(btn.dataset.dial) === dialHours;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        btn.disabled = dialTransitioning;
      }
    }

    function applyDialMode() {
      updateDialModeUi();
      drawTicks();
      const now = currentInstant();
      drawRoundClock(now);
      setHourHandAngle(hourHandAngle(now));
    }

    function animateDialMode(mode) {
      if (dialTransitioning || mode === dialHours) return;

      const fromMode = dialHours;
      const startedAt = currentInstant();
      const fromHourAngle = hourHandAngle(startedAt, fromMode);
      const toHourAngle = hourHandAngle(startedAt, mode);
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // A hidden tab never receives animation frames, so switch instantly.
      if (reduceMotion || document.hidden) {
        dialHours = mode;
        saveDialMode(mode);
        applyDialMode();
        return;
      }

      // Build both 12-hour halves at their shared source positions before the
      // target mode becomes active. Their signed angle interpolation makes one
      // half move clockwise and the other anti-clockwise at the same time.
      const updateScale = prepareDialScaleTransition(fromMode, mode);
      const updateArcs = prepareArcsTransition(startedAt, fromMode, mode);
      dialTransitioning = true;
      dialHours = mode;
      saveDialMode(mode);
      updateDialModeUi();
      el.clockWrap.classList.add('is-transitioning');

      let animationStart = null;
      let frameHandle = 0;

      function finish() {
        cancelAnimationFrame(frameHandle);
        document.removeEventListener('visibilitychange', onHidden);
        dialTransitioning = false;
        drawTicks();
        const now = currentInstant();
        drawRoundClock(now);
        setHourHandAngle(hourHandAngle(now));
        updateDialModeUi();
        el.clockWrap.classList.remove('is-transitioning');
      }

      // Animation frames pause in a hidden tab; snap to the end state rather
      // than leaving the dial half-way when the user switches apps.
      function onHidden() {
        if (document.hidden) finish();
      }
      document.addEventListener('visibilitychange', onHidden);

      function frame(timestamp) {
        if (animationStart === null) animationStart = timestamp;
        const progress = Math.min(1, (timestamp - animationStart) / DIAL_TRANSITION_MS);
        const eased = easeInOutCubic(progress);
        updateScale(eased);
        updateArcs(eased);

        // Direct signed interpolation preserves the natural mapping: AM and PM
        // rotate in opposite directions, and switching back reverses the path.
        setHourHandAngle(fromHourAngle + (toHourAngle - fromHourAngle) * eased);

        if (progress < 1) {
          frameHandle = requestAnimationFrame(frame);
          return;
        }
        finish();
      }

      frameHandle = requestAnimationFrame(frame);
    }

    el.hourToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.seg-btn');
      if (!btn || dialTransitioning) return;
      animateDialMode(Number(btn.dataset.dial));
    });

    function applyConfigUi() {
      document.title = clockConfig.title;
      el.brandTitle.textContent = clockConfig.title;
      el.brandSubtitle.textContent = clockConfig.subtitle;
      el.clockTitle.textContent = clockConfig.title;
    }

    function showFatalError(errors) {
      document.title = 'Clock config error';
      el.app.replaceChildren();
      const card = document.createElement('div');
      card.className = 'fatal-card';
      const heading = document.createElement('h2');
      heading.textContent = 'Clock config invalid';
      const intro = document.createElement('p');
      intro.textContent = 'Fix the inline clockConfig JSON block and reload.';
      const list = document.createElement('ul');
      for (const message of errors) {
        const item = document.createElement('li');
        item.textContent = message;
        list.appendChild(item);
      }
      card.append(heading, intro, list);
      el.app.appendChild(card);
    }

    function initialize() {
      let raw = null;
      try {
        raw = JSON.parse(document.getElementById('clockConfig').textContent);
      } catch (error) {
        showFatalError([`clockConfig block is not valid JSON: ${error.message}`]);
        return;
      }

      const errors = validateConfig(raw);
      if (errors.length) {
        showFatalError(errors);
        return;
      }

      applyConfig(raw);
      applyConfigUi();
      buildGradientDefs();
      buildArcLayerGroups();

      dialHours = loadDialMode();
      applyDialMode();
      update();
      setInterval(update, 1000);
    }

    initialize();
  </script>
</body>
</html>
